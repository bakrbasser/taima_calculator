name: taima_calculator
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  meta: ^1.16.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.7+1
  get_it: ^9.2.1
  go_router: ^17.2.3
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  msix: ^3.16.7
  inno_bundle: ^0.11.2

msix_config:
  display_name: Your App Name
  publisher_display_name: Your Company Name
  identity_name: YourCompany.YourAppSuite.YourApp
  msix_version: 1.0.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/taima_logo.png
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900

inno_bundle:
  id: 3746e500-73f9-11f1-a129-bfd95f4f373e
  publisher: BAKER ALBASSER